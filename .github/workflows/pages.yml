# بيشغّل الاختبارات، ويجهز فولدر _site، وينشره على GitHub Pages.
# بيشتغل مع أي push على main أو master، أو بإيدك من تاب Actions (workflow_dispatch).
# قبل أول نشر: Settings → Pages → Source = "GitHub Actions".
# ملحوظة: GitHub بيسمح افتراضياً بالنشر من البرانش الأساسي للـ repo بس (environment: github-pages).
# لو الاتنين موجودين، التاني محتاج يتضاف في Settings → Environments → github-pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tests
        run: node --test

      - name: Build site folder
        run: node scripts/build-site.js _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
